<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#667eea" />
    <title>DayMap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

      mount(
        {
          entrypoint: "app.py",
          requirements: ["sqlite3"],
          files: {
            "app.py": { url: "../app.py" },
            "app_db.py": { url: "../app_db.py" },
            "Planner.py": { url: "../Planner.py" },
            "assets/style.css": { url: "../assets/style.css" },
          },
          idbfsMountpoints: ["/mnt"],
          streamlitConfig: {
            "client.toolbarMode": "viewer",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
