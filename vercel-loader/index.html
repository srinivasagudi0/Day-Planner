<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>Starting DayMap</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="loader-card">
      <div class="logo" aria-hidden="true">✓</div>
      <p class="eyebrow">DAYMAP</p>
      <h1>Your day is taking shape.</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status" class="status" role="status" aria-live="polite">
        DayMap is waking up. This can take about a minute.
      </p>
      <p class="note">Plan the day, keep tomorrow visible, and close the loop on what got done.</p>
      <noscript>JavaScript is required to open DayMap.</noscript>
    </main>

    <script src="loader.js"></script>
  </body>
</html>
